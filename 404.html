<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="The page you're looking for doesn't exist on TGG HUB.">

    <title>404 — TGG HUB</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(700px, 100%);
            text-align: center;
        }

        .code {
            color: #555;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(4rem, 15vw, 9rem);
            line-height: 0.9;
            letter-spacing: -0.07em;
            margin-bottom: 25px;
        }

        p {
            max-width: 500px;
            margin: 0 auto 35px;
            color: #888;
            font-size: 1rem;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            padding: 13px 22px;
            border: 1px solid #333;
            color: #fff;
            font-size: 0.9rem;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        a:hover {
            background: #151515;
            border-color: #555;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="code">Error 404</div>

        <h1>Lost.</h1>

        <p>
            This page doesn't exist, or it may have moved.
            Either way, there's still somewhere better to go.
        </p>

        <a href="index.html">Return to TGG HUB</a>

    </main>

</body>
</html>
