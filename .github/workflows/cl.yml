
name: TGG HUB Cloudflare Preview

on:
  push:
    branches:
      - revamp/tgg-hub-v2

permissions:
  contents: read
  deployments: write

concurrency:
  group: tgg-hub-cloudflare-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        env:
          TGG_HUB_SITE_URL: https://revamp-preview.tgg-hub-revamp-preview.pages.dev
          TGG_HUB_NOINDEX: "true"
        run: npm run build

      - name: Verify preview metadata in static output
        env:
          TGG_HUB_SITE_URL: https://revamp-preview.tgg-hub-revamp-preview.pages.dev
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const outputDir = path.resolve("out");
          const expectedOrigin = process.env.TGG_HUB_SITE_URL;

          if (!expectedOrigin) {
            throw new Error("TGG_HUB_SITE_URL is not configured.");
          }

          if (!fs.existsSync(outputDir)) {
            throw new Error(
              "Static export directory 'out' was not created."
            );
          }

          function walk(directory) {
            return fs.readdirSync(directory, {
              withFileTypes: true
            }).flatMap((entry) => {
              const fullPath = path.join(directory, entry.name);

              return entry.isDirectory()
                ? walk(fullPath)
                : [fullPath];
            });
          }

          const htmlFiles = walk(outputDir)
            .filter((file) => file.endsWith(".html"))
            .filter((file) => {
              const relativePath = path.relative(outputDir, file)
                .split(path.sep)
                .join("/");

              return relativePath !== "404.html" &&
                relativePath !== "_not-found.html";
            });

          if (htmlFiles.length === 0) {
            throw new Error(
              "No public HTML pages were found in the static export."
            );
          }

          function getTag(html, tagName, attribute, value) {
            return [...html.matchAll(
              new RegExp(`<${tagName}\\b[^>]*>`, "gi")
            )]
              .map((match) => match[0])
              .find((tag) =>
                new RegExp(
                  `\\b${attribute}=["']${value}["']`,
                  "i"
                ).test(tag)
              );
          }

          function getAttribute(tag, attribute) {
            return tag?.match(
              new RegExp(
                `\\b${attribute}=["']([^"']+)["']`,
                "i"
              )
            )?.[1];
          }

          function normalizePath(value) {
            return value.length > 1
              ? value.replace(/\/+$/, "")
              : "/";
          }

          for (const file of htmlFiles) {
            const relativePath = path.relative(outputDir, file)
              .split(path.sep)
              .join("/");

            const html = fs.readFileSync(file, "utf8");

            const robotsTag = getTag(
              html,
              "meta",
              "name",
              "robots"
            );

            const robotsContent =
              getAttribute(robotsTag, "content") || "";

            const directives = robotsContent.toLowerCase()
              .split(",")
              .map((item) => item.trim());

            if (
              !directives.includes("noindex") ||
              !directives.includes("nofollow")
            ) {
              throw new Error(
                `Missing noindex/nofollow metadata: ${relativePath}`
              );
            }

            const canonicalTag = getTag(
              html,
              "link",
              "rel",
              "canonical"
            );

            const canonicalHref = getAttribute(
              canonicalTag,
              "href"
            );

            if (!canonicalHref) {
              throw new Error(
                `Missing canonical URL: ${relativePath}`
              );
            }

            let canonical;

            try {
              canonical = new URL(
                canonicalHref,
                expectedOrigin
              );
            } catch {
              throw new Error(
                `Invalid canonical URL in ${relativePath}: ${canonicalHref}`
              );
            }

            const withoutExtension =
              relativePath.replace(/\.html$/, "");

            const expectedPath = withoutExtension === "index"
              ? "/"
              : `/${withoutExtension.replace(/\/index$/, "")}`;

            if (
              canonical.origin !== expectedOrigin ||
              normalizePath(canonical.pathname) !==
                normalizePath(expectedPath)
            ) {
              throw new Error(
                `Unexpected canonical URL in ${relativePath}: ${canonical.href}`
              );
            }
          }

          const robotsFile = path.join(
            outputDir,
            "robots.txt"
          );

          const sitemapFile = path.join(
            outputDir,
            "sitemap.xml"
          );

          if (
            !fs.existsSync(robotsFile) ||
            !fs.existsSync(sitemapFile)
          ) {
            throw new Error(
              "Generated robots.txt or sitemap.xml is missing."
            );
          }

          const robotsText = fs.readFileSync(
            robotsFile,
            "utf8"
          );

          const sitemapText = fs.readFileSync(
            sitemapFile,
            "utf8"
          );

          const expectedSitemap =
            `${expectedOrigin}/sitemap.xml`;

          if (
            !robotsText.includes(
              `Sitemap: ${expectedSitemap}`
            )
          ) {
            throw new Error(
              "robots.txt points to the wrong sitemap URL."
            );
          }

          const locations = [
            ...sitemapText.matchAll(
              /<loc>(.*?)<\/loc>/g
            )
          ].map((match) => match[1]);

          if (locations.length === 0) {
            throw new Error(
              "The generated sitemap contains no URLs."
            );
          }

          for (const location of locations) {
            let url;

            try {
              url = new URL(location);
            } catch {
              throw new Error(
                `Invalid sitemap URL: ${location}`
              );
            }

            if (url.origin !== expectedOrigin) {
              throw new Error(
                `Sitemap contains an unexpected URL: ${location}`
              );
            }
          }

          console.log(
            `Verified noindex/nofollow and canonical URLs for ${htmlFiles.length} public HTML pages.`
          );

          console.log(
            `Verified robots.txt and ${locations.length} sitemap URLs.`
          );
          NODE

      - name: Deploy Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy out --project-name=tgg-hub-revamp-preview --branch=revamp-preview
